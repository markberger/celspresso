name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # z3-sys finds its prebuilt Z3 through the GitHub API; a token avoids the shared-IP rate limit
  READ_ONLY_GITHUB_TOKEN: ${{ github.token }}
  # deps come from `uv sync --no-install-project`; the extension only from `maturin develop`,
  # so `uv run` must not sync (that would build the Rust extension a second time)
  UV_NO_SYNC: "1"

jobs:
  gate:
    # Exactly what runs locally: lint, clippy, pyright, tests, coverage floors, the cel-spec
    # conformance ratchet and the contract fuzzer. Keep this job a thin wrapper around check.sh.
    name: gate (scripts/check.sh)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt, llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --group dev --locked --no-install-project
      - run: scripts/check.sh  # builds the extension itself

  test:
    # The Python tests on the oldest supported Python and on macOS.
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10" }
          - { os: macos-latest, python: "3.13" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --group dev --locked --no-install-project
      - run: uv run maturin develop --release --quiet
      - run: uv run pytest -q
