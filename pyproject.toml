[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "celspresso"
description = "Typed CEL expressions for Python with formal verification (Rust + Z3)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = ["tomli>=1.1; python_version < '3.11'"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Typing :: Typed",
]

[project.scripts]
celspresso = "celspresso._cli:main"

[project.optional-dependencies]
pydantic = ["pydantic>=2.6"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pydantic>=2.6",
    "maturin>=1.9,<2",
    "pyright>=1.1.400",
    "ruff>=0.8",
    "pytest-cov>=6",
    "prek==0.5.10",
]

[tool.maturin]
manifest-path = "crates/celspresso-py/Cargo.toml"
python-source = "python"
module-name = "celspresso._celspresso"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["python", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "C4",       # comprehensions
    "RUF",      # ruff-specific
    "PT",       # pytest style
    "BLE",      # blind except
    "PIE", "RET", "TC", "PERF",
]
ignore = [
    "RUF001", "RUF002", "RUF003",  # ≡ ⟹ → are intentional in output strings
    "RET505",                      # else-after-return reads fine in type dispatch
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B018"]
"benchmarks/**" = ["E501", "T201"]  # report tables are printed wide

[tool.ruff.format]
docstring-code-format = true

[tool.coverage.run]
source = ["celspresso"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
    "pragma: no cover",
]
