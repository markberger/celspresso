# Git hooks, run by prek (https://prek.j178.dev). Set up once with: uv run prek install
#
# pre-commit: file hygiene, and fix-then-check formatting/lint on the staged files.
# pre-push:   the fast quality gate (scripts/check.sh --fast), so nothing reaches
#             origin without passing it. The full gate (with Rust coverage) stays manual.
default_install_hook_types = ["pre-commit", "pre-push"]

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "mixed-line-ending" },
  { id = "check-merge-conflict" },
  { id = "check-toml" },
  { id = "check-added-large-files" },
  { id = "detect-private-key" },
]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "ruff-check"
name = "ruff check --fix"
language = "system"
entry = "uv run ruff check --fix --exit-non-zero-on-fix"
types = ["python"]

[[repos.hooks]]
id = "ruff-format"
name = "ruff format"
language = "system"
entry = "uv run ruff format"
types = ["python"]

[[repos.hooks]]
id = "cargo-fmt"
name = "cargo fmt"
language = "system"
entry = "cargo fmt --all"
types = ["rust"]
pass_filenames = false

[[repos.hooks]]
id = "gate"
name = "quality gate (scripts/check.sh --fast)"
language = "system"
entry = "scripts/check.sh --fast"
pass_filenames = false
always_run = true
stages = ["pre-push"]
