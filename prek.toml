# Pre-commit hooks, run by prek (https://prek.j178.dev): file hygiene, and fix-then-check
# formatting/lint on the staged files. Set up once with: uv run prek install
# The pre-push gate is a plain hook, scripts/pre-push (see that file for why).
default_install_hook_types = ["pre-commit"]
default_stages = ["pre-commit"]

[[repos]]
repo = "builtin"
hooks = [
  # these three declare more stages in their manifests; keep them to commits
  { id = "trailing-whitespace", stages = ["pre-commit"] },
  { id = "end-of-file-fixer", stages = ["pre-commit"] },
  { id = "mixed-line-ending" },
  { id = "check-merge-conflict" },
  { id = "check-toml" },
  { id = "check-added-large-files", stages = ["pre-commit"] },
  { id = "detect-private-key" },
]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "ruff-check"
name = "ruff check --fix"
language = "system"
entry = "uv run --no-sync ruff check --fix --exit-non-zero-on-fix"
types = ["python"]

[[repos.hooks]]
id = "ruff-format"
name = "ruff format"
language = "system"
entry = "uv run --no-sync ruff format"
types = ["python"]

[[repos.hooks]]
id = "cargo-fmt"
name = "cargo fmt"
language = "system"
entry = "cargo fmt --all"
types = ["rust"]
pass_filenames = false
